name: Daily listing check

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 05:17 South African time (03:17 UTC)
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab
  repository_dispatch:      # started by the Gmail Apps Script when new alert emails arrive
    types: [new-emails]

concurrency:                # never run two checks at once; queue the next one instead
  group: listing-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
