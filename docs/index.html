<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deal Finder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #e3e1da;
    --accent: #1f6f4a; --great: #1a9850; --good: #91cf60; --fair: #e8b33a; --high: #d73027; --none: #9aa19d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --panel: #1c2120; --ink: #e8ebe9; --muted: #9aa49f; --line: #2c3331; --accent: #5fc08f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --panel: #1c2120; --ink: #e8ebe9; --muted: #9aa49f; --line: #2c3331; --accent: #5fc08f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); }
  .filters label { display: flex; gap: 6px; align-items: center; }
  select, input[type=number] { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
  input[type=number] { width: 120px; }
  main { display: grid; grid-template-columns: 360px 1fr; flex: 1; min-height: 0; }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  #map { height: 100%; }
  .summary { padding: 10px 14px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: 13px; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 92px 1fr 54px; gap: 10px; align-items: start; }
  .thumb { width: 92px; height: 62px; border-radius: 8px; object-fit: cover; display: block; background: var(--line); }
  .thumb.none { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .popup-photo { display: block; width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; background: var(--line); }
  .item:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .badge { border-radius: 8px; color: #fff; font-weight: 650; text-align: center; padding: 6px 0; font-size: 13px; align-self: start; }
  .badge small { white-space: nowrap; }
  .badge small { display: block; font-weight: 400; font-size: 10px; opacity: .9; }
  .price { font-weight: 650; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .drop { color: var(--great); font-size: 12px; font-weight: 600; }
  .empty { padding: 24px 16px; color: var(--muted); }
  .legend { background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 12px; line-height: 1.7; }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .pin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .leaflet-popup-content { font-size: 13px; line-height: 1.5; }
  .leaflet-popup-content a.open { display: inline-block; margin-top: 6px; font-weight: 600; color: var(--accent); }
  .note { font-size: 11.5px; color: var(--muted); padding: 10px 14px; }
  .filters { order: 3; flex-basis: 100%; }
  .themebtn { order: 2; margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  .cluster { border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px;
             border: 2px solid #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55);
             box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 35%, transparent), 0 1px 4px rgba(0,0,0,.4); }
  /* Leaflet's own controls and popups follow the theme */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-bar a, .leaflet-control-layers,
  .leaflet-control-attribution { background: var(--panel) !important; color: var(--ink) !important; }
  .leaflet-bar a { border-bottom-color: var(--line) !important; }
  .leaflet-control-attribution a { color: var(--accent) !important; }
  .chipbtn { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; }
  .filtersbtn, .viewswitch { display: none; }
  .legend details summary { cursor: pointer; font-weight: 600; list-style: none; }
  .legend details summary::-webkit-details-marker { display: none; }
  .legend details[open] summary { margin-bottom: 4px; }

  /* ---------- Phones ---------- */
  @media (max-width: 760px) {
    body { height: 100dvh; }
    header { padding: 10px 12px 8px; gap: 8px; }
    h1 { font-size: 16px; }
    .filtersbtn { display: inline-flex; gap: 6px; order: 2; margin-left: auto; }
    .themebtn { order: 3; margin-left: 0; padding: 6px 10px; }
    .themebtn .lbl { display: none; }
    .tabs { order: 4; flex-basis: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { white-space: nowrap; flex: 0 0 auto; }
    .filters { display: none; order: 5; }
    body.filters-open .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding-top: 4px; }
    .filters label { flex-direction: column; align-items: stretch; gap: 3px; font-size: 12px; }
    .filters label:has(input[type=checkbox]) { flex-direction: row; align-items: center; font-size: 14px; }
    .filters select, .filters input[type=number] { width: 100%; font-size: 16px; padding: 7px 8px; } /* 16px stops iPhone zooming in */
    main { display: block; position: relative; }
    #map, #list { position: absolute; inset: 0; height: auto; }
    #list { visibility: hidden; border-right: 0; padding-bottom: 80px; }
    body.view-list #list { visibility: visible; }
    body.view-list #map { visibility: hidden; }
    .viewswitch { display: flex; position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%);
                  bottom: calc(16px + env(safe-area-inset-bottom)); background: var(--panel); border: 1px solid var(--line);
                  border-radius: 999px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
    .viewswitch button { border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 600; padding: 9px 20px; border-radius: 999px; cursor: pointer; }
    .viewswitch button.on { background: var(--accent); color: #fff; }
    .legend { font-size: 11.5px; padding: 6px 9px; margin-bottom: 76px !important; }
    .leaflet-bottom.leaflet-left .leaflet-control-attribution { display: none; }
    .item { grid-template-columns: 84px 1fr 52px; padding: 10px 12px; }
    .leaflet-control-zoom { display: none; }  /* pinch to zoom on phones */
    .popup-photo { height: 110px; }
    .leaflet-popup-content { margin: 12px 14px; }
    .thumb { width: 84px; height: 60px; }
  }
</style>
</head>
<body>
<header>
  <h1>Deal Finder</h1>
  <div class="tabs" id="tabs"></div>
  <div class="filters">
    <label>Deals <select id="minScore">
      <option value="-999" selected>all listings</option>
      <option value="0">at or below market</option>
      <option value="10">10%+ below</option>
      <option value="20">20%+ below</option>
    </select></label>
    <label>Max price <input id="maxPrice" type="number" step="50000" placeholder="any"></label>
    <label>Beds <select id="minBeds"><option value="0">any</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
    <label>Type <select id="ptype"><option value="">any</option><option>house</option><option>townhouse</option><option>apartment</option><option>land</option><option>farm</option></select></label>
    <label title="Based on when a listing last appeared in an alert (new, price drop or show day)">Listed
      <select id="maxAge">
        <option value="7">last 7 days</option>
        <option value="30">last 30 days</option>
        <option value="90" selected>last 90 days</option>
        <option value="0">any time</option>
      </select></label>
    <label>Sort
      <select id="sortBy">
        <option value="deal">best deal first</option>
        <option value="price_asc">price: low to high</option>
        <option value="price_desc">price: high to low</option>
        <option value="newest">newest first</option>
      </select></label>
    <label><input type="checkbox" id="dropsOnly"> price dropped</label>
    <label title="When a suburb has too few similar listings, also compare with suburbs within 3 km">Compare with
      <select id="compare"><option value="suburb">same suburb</option><option value="nearby">+ nearby suburbs</option></select></label>
  </div>
  <button class="chipbtn filtersbtn" id="filtersBtn" aria-expanded="false">Filters</button>
  <button class="themebtn" id="themeBtn" title="Switch between automatic, light and dark"><span class="lbl">Theme: </span>Auto</button>
</header>
<main>
  <div id="list"><div class="empty">Loading listings…</div></div>
  <div id="map"></div>
</main>
<nav class="viewswitch" aria-label="Show map or list">
  <button id="viewMap" class="on">Map</button><button id="viewList">List</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
// Publishable key: safe to share. The database only allows reading with it.
const SUPABASE_URL = "https://oqctqrhxeuqlhopnmsmt.supabase.co";
const SUPABASE_KEY = "sb_publishable_n3s6e7fY50SPVjm6eZgFeA_Lb0262BE";

const REGIONS = {
  all:         { label: "All areas",            center: [-28.6, 24.5],      zoom: 5 },
  durbanville: { label: "Durbanville & surrounds", center: [-33.832, 18.647], zoom: 12 },
  polokwane:   { label: "Polokwane",            center: [-23.9045, 29.4689], zoom: 12 },
  tzaneen:     { label: "Tzaneen",              center: [-23.8332, 30.1635], zoom: 12 },
};

function colour(s) {
  if (s == null) return "var(--none)";
  if (s >= 15) return "var(--great)";
  if (s >= 5) return "var(--good)";
  if (s >= -5) return "var(--fair)";
  return "var(--high)";
}
// Which comparison is switched on: "suburb" (strict) or "nearby" (falls back to suburbs within 3 km)
let compareMode = "suburb";
try { compareMode = localStorage.getItem("compare") || "suburb"; } catch (e) {}
const S = l => compareMode === "nearby"
  ? { score: l.wide_score, median: l.wide_median, comps: l.wide_comps, basis: l.wide_basis }
  : { score: l.deal_score, median: l.suburb_median, comps: l.comps_count, basis: l.score_basis };

const isPhone = () => window.matchMedia("(max-width: 760px)").matches;

// Age of a listing
const DAY = 864e5;
const daysSince = d => d ? Math.max(0, Math.floor((Date.now() - new Date(d).getTime()) / DAY)) : null;
const ageText = d => { const n = daysSince(d); return n == null ? "" : n === 0 ? "today" : n === 1 ? "1 day ago" : `${n} days ago`; };

// How much to trust a score, by how many similar listings it was based on
const confidence = n => n >= 10 ? "solid" : n >= 6 ? "fair" : "early estimate";

// ---- Light / dark theme ---------------------------------------------------------
const THEMES = ["auto", "light", "dark"];
let theme = "auto";
try { theme = localStorage.getItem("theme") || "auto"; } catch (e) {}
const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => theme === "dark" || (theme === "auto" && darkQuery.matches);
function applyTheme() {
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  document.getElementById("themeBtn").innerHTML =
    '<span class="lbl">Theme: </span>' + { auto: "Auto", light: "Light", dark: "Dark" }[theme];
  const gl = openFreeMap && openFreeMap.getMaplibreMap && openFreeMap.getMaplibreMap();
  if (gl && gl._dfStyle !== streetStyle()) { gl._dfStyle = streetStyle(); gl.setStyle(streetStyle()); }
}
const streetStyle = () => `https://tiles.openfreemap.org/styles/${isDark() ? "dark" : "liberty"}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rand = v => v ? "R " + Math.round(v).toLocaleString("en-ZA").replace(/,/g, " ") : "POA";
const num = v => v == null ? null : +(+v).toFixed(1);

let all = [], twins = {}, region = "all";
const SITE = { property24: "Property24", privateproperty: "Private Property", facebook: "Facebook", manual: "your list" };
try { region = localStorage.getItem("region") || "all"; } catch (e) {}

const SA_BOUNDS = L.latLngBounds([-35.6, 15.5], [-21.2, 33.5]);
const map = L.map("map", {
  zoomControl: true, maxZoom: 19, minZoom: 5,
  maxBounds: SA_BOUNDS.pad(0.15), maxBoundsViscosity: 1.0, worldCopyJump: false,
});
// Map backgrounds: all free, no API key, and they work when the page is opened as a local file.
const esri = (service, attribution) => L.tileLayer(
  `https://server.arcgisonline.com/ArcGIS/rest/services/${service}/MapServer/tile/{z}/{y}/{x}`,
  { maxZoom: 19, attribution, noWrap: true, bounds: SA_BOUNDS.pad(0.5) });
const esriStreets = esri("World_Street_Map", "Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors");
const satellite = L.layerGroup([
  esri("World_Imagery", "Imagery &copy; Esri, Maxar, Earthstar Geographics"),
  esri("Reference/World_Transportation", ""),
  esri("Reference/World_Boundaries_and_Places", ""),
]);
function webglAvailable() {
  try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
  catch (e) { return false; }
}
const openFreeMap = (window.L.maplibreGL && webglAvailable())
  ? L.maplibreGL({
      style: streetStyle(),
      attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
    })
  : null;
const baseMaps = openFreeMap
  ? { "Streets": openFreeMap, "Streets (backup)": esriStreets, "Satellite": satellite }
  : { "Streets": esriStreets, "Satellite": satellite };
let baseName = "Streets";
try { baseName = localStorage.getItem("baseMap") || "Streets"; } catch (e) {}
(baseMaps[baseName] || baseMaps.Streets).addTo(map);
L.control.layers(baseMaps, null, { position: "topright" }).addTo(map);
map.on("baselayerchange", e => { try { localStorage.setItem("baseMap", e.name); } catch (err) {} });
const cluster = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 40,
  iconCreateFunction: c => {
    const scores = c.getAllChildMarkers().map(m => m.options.score).filter(s => s != null);
    const best = scores.length ? Math.max(...scores) : null;
    const n = c.getChildCount();
    const size = n < 10 ? 34 : n < 100 ? 40 : 46;
    return L.divIcon({ className: "", iconSize: [size, size],
      html: `<div class="cluster" style="--c:${colour(best)};width:${size}px;height:${size}px">${n}</div>` });
  },
});
map.addLayer(cluster);

const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = `<details ${isPhone() ? "" : "open"}><summary>Key</summary>` + [["--great","15%+ below similar"],["--good","5–15% below"],["--fair","about market"],["--high","above market"],["--none","not enough comps yet"]]
    .map(([v, t]) => `<div><span class="dot" style="background:var(${v})"></span>${t}</div>`).join("")
    + `<div style="margin-top:4px;color:var(--muted)">Bubbles show how many listings;<br>colour = best deal inside</div></details>`;
  L.DomEvent.disableClickPropagation(d);
  return d;
};
legend.addTo(map);

function basisText(l) {
  const s = S(l);
  if (s.score == null) return compareMode === "nearby"
    ? "Not enough similar listings in this suburb or within 3 km yet to score it."
    : "Not enough similar listings in this suburb yet. Try “Compare with: + nearby suburbs”.";
  const dir = s.score >= 0 ? `${Math.abs(s.score).toFixed(0)}% below` : `${Math.abs(s.score).toFixed(0)}% above`;
  const nearby = (s.basis || "").startsWith("nearby_");
  const where = nearby ? "within 3 km (nearby suburbs)" : `in ${esc(l.suburb)}`;
  const what = l.bedrooms ? `${num(l.bedrooms)}-bed listings` : (l.property_type === "land" ? "plots" : "listings");
  const how = (s.basis || "").endsWith("price_per_m2")
    ? `${dir} the median of ${rand(s.median)}/m² across ${s.comps} similar listings ${where}.`
    : `${dir} the median price of ${s.comps} other ${what} ${where}.`;
  return `${how} <span class="meta">(${nearby ? "nearby comparison, " : ""}${confidence(s.comps)})</span>`;
}

const photo = (l, cls) => l.image_url
  ? `<img class="${cls}" src="${esc(l.image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
  : (cls === "thumb" ? `<div class="thumb none">no photo</div>` : "");

function popup(l) {
  const facts = [l.bedrooms && `${num(l.bedrooms)} bed`, l.bathrooms && `${num(l.bathrooms)} bath`,
                 l.floor_m2 && `${num(l.floor_m2)} m²`, l.erf_m2 && `erf ${num(l.erf_m2)} m²`, l.property_type].filter(Boolean).join(" · ");
  const drop = l.first_price && l.price && l.price < l.first_price
    ? `<div class="drop">Dropped from ${rand(l.first_price)}</div>` : "";
  return `<div>${photo(l, "popup-photo")}<b>${esc(l.title || `${(l.property_type || "property").replace(/^./, c => c.toUpperCase())} in ${l.suburb}`)}</b>
    <div class="price" style="font-size:15px">${rand(l.price)}</div>${drop}
    <div class="meta">${esc(facts)}</div>
    ${l.address ? `<div class="meta">${esc(l.address)}</div>` : ""}
    <div class="meta">${esc(l.suburb)}, ${esc(l.city || "")} · listed ${ageText(l.first_seen)}${
      daysSince(l.last_seen) < daysSince(l.first_seen) ? ` · last in an alert ${ageText(l.last_seen)}` : ""}</div>
    <div style="margin-top:6px">${basisText(l)}</div>
    <div class="meta" style="margin-top:4px">${l.pin_level === "address" ? "📍 Pin is at the street address."
      : l.pin_level === "town" ? "Pin is at the town centre (suburb not found)." : "Pin is at the suburb centre."}</div>
    <a class="open" href="${esc(l.url)}" target="_blank" rel="noopener">Open on ${SITE[l.source] || "site"} ↗</a>
    ${(twins[l.id] || []).map(t => `&nbsp;·&nbsp;<a class="open" href="${esc(t.url)}" target="_blank" rel="noopener">Also on ${SITE[t.source] || "another site"} ↗</a>`).join("")}
    ${l.trends_url ? `&nbsp;·&nbsp;<a class="open" href="${esc(l.trends_url)}" target="_blank" rel="noopener" title="Average asking and sold prices for ${esc(l.suburb)} on Property24">Area sold prices ↗</a>` : ""}</div>`;
}

function filtered() {
  const minScore = +document.getElementById("minScore").value;
  const maxPrice = +document.getElementById("maxPrice").value || Infinity;
  const minBeds = +document.getElementById("minBeds").value;
  const ptype = document.getElementById("ptype").value;
  const drops = document.getElementById("dropsOnly").checked;
  const maxAge = +document.getElementById("maxAge").value;
  const sortBy = document.getElementById("sortBy").value;
  const price = l => l.price || null;  // listings without a price ("POA") always go last
  const sorters = {
    deal: (a, b) => (S(b).score ?? -999) - (S(a).score ?? -999),
    price_asc: (a, b) => (price(a) ?? Infinity) - (price(b) ?? Infinity),
    price_desc: (a, b) => (price(b) ?? -Infinity) - (price(a) ?? -Infinity),
    newest: (a, b) => new Date(b.first_seen) - new Date(a.first_seen),
  };
  return all.filter(l =>
    (!maxAge || daysSince(l.last_seen || l.first_seen) <= maxAge) &&
    (region === "all" || l.region === region) &&
    (minScore <= -999 || (S(l).score != null && S(l).score >= minScore)) &&
    (!l.price || l.price <= maxPrice) &&
    (!minBeds || (l.bedrooms || 0) >= minBeds) &&
    (!ptype || l.property_type === ptype) &&
    (!drops || (l.first_price && l.price < l.first_price))
  ).sort(sorters[sortBy] || sorters.deal);
}

function render() {
  const rows = filtered();
  cluster.clearLayers();
  const markers = {};
  for (const l of rows) {
    if (l.lat == null) continue;
    const icon = L.divIcon({ className: "", html: `<div class="pin" style="background:${colour(S(l).score)}"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] });
    const m = L.marker([l.lat, l.lng], { icon, score: S(l).score }).bindPopup(popup(l), { maxWidth: 290, autoPanPaddingTopLeft: [10, 70], autoPanPaddingBottomRight: [10, 90] });
    cluster.addLayer(m);
    markers[l.id] = m;
  }
  const list = document.getElementById("list");
  if (!all.length) {
    list.innerHTML = `<div class="empty">No listings yet. They appear after the first daily run reads your alert emails.</div>`;
    return;
  }
  const scored = rows.filter(l => S(l).score != null).length;
  document.getElementById("viewList").textContent = `List (${rows.length})`;
  const active = [+document.getElementById("minScore").value !== -999, !!document.getElementById("maxPrice").value,
    document.getElementById("minBeds").value !== "0", !!document.getElementById("ptype").value,
    document.getElementById("maxAge").value !== "90", document.getElementById("dropsOnly").checked, compareMode !== "suburb"]
    .filter(Boolean).length;
  document.getElementById("filtersBtn").textContent = active ? `Filters (${active})` : "Filters";
  list.innerHTML = `<div class="summary">${rows.length} listing${rows.length === 1 ? "" : "s"} shown · ${scored} scored · ${all.length} in total</div>` +
    (rows.length ? rows.slice(0, 300).map(l => `
      <div class="item" data-id="${esc(l.id)}">
        ${photo(l, "thumb")}
        <div><div class="price">${rand(l.price)}</div>
          ${l.first_price && l.price < l.first_price ? `<div class="drop">was ${rand(l.first_price)}</div>` : ""}
          <div class="meta">${esc(l.suburb)}, ${esc(l.city || "")}</div>
          <div class="meta">${[l.bedrooms && num(l.bedrooms) + " bed", l.floor_m2 && num(l.floor_m2) + " m²", l.property_type].filter(Boolean).join(" · ")}</div>
          <div class="meta">listed ${ageText(l.first_seen)} · ${twins[l.id] ? "on both sites" : esc(SITE[l.source] || l.source)}</div>
        </div>
        <div class="badge" style="background:${colour(S(l).score)}">${S(l).score == null ? "–" : (S(l).score > 0 ? "−" : "+") + Math.abs(S(l).score).toFixed(0) + "%"}<small>${S(l).score == null ? "no comps" : S(l).comps + ((S(l).basis || "").startsWith("nearby_") ? " near" : " comps")}</small></div>
      </div>`).join("") : `<div class="empty">Nothing matches these filters. Try “all listings” or “Listed: any time”.</div>`) +
    `<div class="note">Pins sit on the suburb centre unless the listing gave a street address. Scores compare asking prices with other listings, not sold prices, and get more reliable as more listings are collected. For what homes actually sold for, use “Area sold prices” in a listing’s popup.</div>`;
  list.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
    const m = markers[el.dataset.id];
    if (m && document.body.classList.contains("view-list")) setView("map");
    if (m) cluster.zoomToShowLayer(m, () => m.openPopup());
    else window.open(all.find(l => l.id === el.dataset.id).url, "_blank", "noopener");
  }));
}

function setRegion(r, fly = true) {
  region = r;
  try { localStorage.setItem("region", r); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.r === r));
  const { center, zoom } = REGIONS[r];
  fly ? map.flyTo(center, zoom, { duration: .8 }) : map.setView(center, zoom);
  render();
}

document.getElementById("tabs").innerHTML = Object.entries(REGIONS)
  .map(([k, v]) => `<button data-r="${k}">${v.label}</button>`).join("");
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => setRegion(b.dataset.r)));
for (const id of ["maxAge", "sortBy"]) {  // remember these between visits
  const el = document.getElementById(id);
  try { const saved = localStorage.getItem(id); if (saved && [...el.options].some(o => o.value === saved)) el.value = saved; } catch (e) {}
  el.addEventListener("input", () => { try { localStorage.setItem(id, el.value); } catch (e) {} });
}
["minScore", "maxPrice", "minBeds", "ptype", "dropsOnly", "maxAge", "sortBy"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));
const compareSel = document.getElementById("compare");
compareSel.value = compareMode === "nearby" ? "nearby" : "suburb";
compareSel.addEventListener("input", () => {
  compareMode = compareSel.value;
  try { localStorage.setItem("compare", compareMode); } catch (e) {}
  render();
});

async function load() {
  const rows = [];
  for (let offset = 0; ; offset += 1000) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/listings?select=*&order=id&limit=1000&offset=${offset}`,
      { headers: { apikey: SUPABASE_KEY } });
    if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
    const batch = await res.json();
    rows.push(...batch);
    if (batch.length < 1000) break;
  }
  return rows;
}

function setView(v) {
  document.body.classList.toggle("view-list", v === "list");
  document.getElementById("viewMap").classList.toggle("on", v === "map");
  document.getElementById("viewList").classList.toggle("on", v === "list");
  if (v === "map") setTimeout(() => map.invalidateSize(), 50);
}
document.getElementById("viewMap").addEventListener("click", () => setView("map"));
document.getElementById("viewList").addEventListener("click", () => setView("list"));
document.getElementById("filtersBtn").addEventListener("click", () => {
  const open = document.body.classList.toggle("filters-open");
  document.getElementById("filtersBtn").setAttribute("aria-expanded", open);
  setTimeout(() => map.invalidateSize(), 50);
});
document.getElementById("themeBtn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("theme", theme); } catch (e) {}
  applyTheme();
});
darkQuery.addEventListener("change", () => { if (theme === "auto") applyTheme(); });
applyTheme();

if (!REGIONS[region]) region = "all";
setRegion(region, false);
load().then(rows => {
    twins = {};
    for (const l of rows) if (l.duplicate_of) (twins[l.duplicate_of] ||= []).push(l);
    all = rows.filter(l => !l.duplicate_of);
    render();
  })
  .catch(err => {
    document.getElementById("list").innerHTML =
      `<div class="empty">Couldn't load listings (${esc(err.message)}). If the database was paused for inactivity, open Supabase and restore it.</div>`;
  });
</script>
</body>
</html>
