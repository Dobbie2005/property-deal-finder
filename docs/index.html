// A point inside an outline: its centre, or for odd shapes (e.g. along a dam) the middle of the widest
// stretch across it. Same rule as the daily job.
function insidePoint(geo) {
  const polys = geo.type === "MultiPolygon" ? geo.coordinates : [geo.coordinates];
  const rings = polys.filter(p => p && p[0] && p[0].length >= 3).map(p => p[0]);
  if (!rings.length) return null;
  const stats = r => { let a = 0, cx = 0, cy = 0;
    r.forEach((p, i) => { const q = r[(i + 1) % r.length], f = p[0] * q[1] - q[0] * p[1]; a += f; cx += (p[0] + q[0]) * f; cy += (p[1] + q[1]) * f; });
    return Math.abs(a) < 1e-14 ? [0, r.reduce((s, p) => s + p[0], 0) / r.length, r.reduce((s, p) => s + p[1], 0) / r.length] : [a / 2, cx / (3 * a), cy / (3 * a)]; };
  const ring = rings.reduce((b, r) => Math.abs(stats(r)[0]) > Math.abs(stats(b)[0]) ? r : b);
  const [, cx, cy] = stats(ring);
  const xs = [];
  ring.forEach((p, i) => { const q = ring[(i + 1) % ring.length];
    if ((p[1] > cy) !== (q[1] > cy)) xs.push(p[0] + (cy - p[1]) * (q[0] - p[0]) / (q[1] - p[1])); });
  xs.sort((a, b) => a - b);
  if (xs.filter(x => x > cx).length % 2 === 1 || xs.length < 2) return [cy, cx];   // centre is inside
  let best = [xs[0], xs[1]];
  for (let i = 0; i + 1 < xs.length; i += 2) if (xs[i + 1] - xs[i] > best[1] - best[0]) best = [xs[i], xs[i + 1]];
  return [cy, (best[0] + best[1]) / 2];
}
// Listings without a street address sit in the middle of their suburb's outline
function applyAreaPins() {
  for (const l of [...all, ...Object.values(twins).flat()]) {
    l._orig ||= { lat: l.lat, lng: l.lng, pin_level: l.pin_level, region: l.region, suburb: l.suburb, city: l.city, listed_suburb: l.listed_suburb };
    Object.assign(l, l._orig);
    // a suburb merged into another one (follow the chain, e.g. Kuils River South -> Kuils River)
    let mk = areaKeyOf(l), hops = 0;
    while (areas[mk]?.merged_into && hops++ < 5) mk = areas[mk].merged_into;
    if (hops && areas[mk]) {
      const t = areas[mk];
      l.listed_suburb = l.listed_suburb || l.suburb;
      l.suburb = t.name; l.city = t.city || l.city;
      if (l.pin_level !== "address") { l.lat = l._orig.lat; l.lng = l._orig.lng; }
    }
    if (l.pin_level === "address" || !l.suburb) continue;
    const a = areas[areaKeyOf(l)];
    if (!a || a.hidden || !a.boundary) continue;
    const pt = insidePoint(a.boundary);
    if (!pt) continue;
    [l.lat, l.lng] = pt; l.pin_level = "area";
    if (a.region && REGIONS[a.region]) l.region = a.region;
  }
}

function drawAreas() {
  if (!areaLayer) return;
  areaLayer.clearLayers();
  document.getElementById("areasBtn").classList.toggle("on", areasOn);
  drawTodo();
  if (!areasOn) return;
  for (const a of Object.values(areas)) {
    if (a.hidden || a.merged_into || (region !== "all" && a.region !== region)) continue;
    let centre = a.lat != null ? L.latLng(a.lat, a.lng) : null;
    const guess = !a.boundary && approxOutline(a);
    if (guess) {
      const shape = L.geoJSON(guess, { style: () => ({ ...areaStyle(a), weight: 1.4, dashArray: "2 5", fillOpacity: .03 }), pmIgnore: true });
      shape.bindPopup(() => areaSummary(a.key) + `<div class="meta" style="margin-top:6px">Rough outline (OpenStreetMap has no edge for this suburb). Fix it with Area details → Adjust outline.</div>`, { maxWidth: 260 });
      shape.addTo(areaLayer);
    }
    if (a.boundary) {
      const shape = L.geoJSON(a.boundary, { style: () => areaStyle(a), pmIgnore: true });
      shape.on("mouseover", () => shape.setStyle({ fillOpacity: .16 })).on("mouseout", () => shape.setStyle({ fillOpacity: .07 }));
      shape.bindPopup(() => areaSummary(a.key), { maxWidth: 260 });
      shape.addTo(areaLayer);
      centre = shape.getBounds().getCenter();
    }
    if (!centre) continue;
    const has = areaPrices.some(p => p.area_key === a.key);
    L.marker(centre, { pane: "areaLabels", pmIgnore: true, keyboard: false,
      icon: L.divIcon({ className: "area-label", iconSize: null,
        html: `<span class="${a.boundary ? "" : "no-outline"}" title="${a.boundary ? "" : "Rough outline only: open it to adjust"}">${esc(areaName(a))}${has ? " <b>R</b>" : ""}</span>` }) })
      .bindPopup(() => areaSummary(a.key), { maxWidth: 260 }).addTo(areaLayer);
  }
}
const updateFar = () => document.getElementById("map").classList.toggle("far", map.getZoom() < 12);
map.on("zoomend", updateFar); updateFar();
document.getElementById("areasBtn").addEventListener("click", () => {
  areasOn = !areasOn;
  try { localStorage.setItem("areas", areasOn ? "on" : "off"); } catch (e) {}
  drawAreas();
  if (areasOn && !Object.keys(areas).length) alert("No suburb outlines yet. They're added by the next listing check (every 15 minutes when alerts arrive).");
});
darkQuery.addEventListener("change", drawAreas);
document.getElementById("themeBtn").addEventListener("click", drawAreas);

// ----- Area details: asking prices now, and the sold figures you've saved -------------------------
function areaFromListing(key, listingId) {
  const l = all.find(x => x.id === listingId) || all.find(x => areaKeyOf(x) === key);
  return l ? { key, name: l.suburb, city: l.city, region: l.region, lat: l.lat, lng: l.lng } : null;
}
async function ensureArea(a) {  // sold figures need the area to exist in the database
  if (areas[a.key]?.updated_at) return true;
  const { error } = await sb.from("areas").upsert({ key: a.key, name: a.name, city: a.city, region: a.region, lat: a.lat, lng: a.lng },
                                                  { onConflict: "key", ignoreDuplicates: true });
  if (error) { alert("Couldn't save: " + error.message); return false; }
  areas[a.key] = { ...a, ...(areas[a.key] || {}), updated_at: areas[a.key]?.updated_at || new Date().toISOString() };
  return true;
}
window.dfArea = (key, listingId) => {
  const a = areas[key] || areaFromListing(key, listingId);
  if (!a) return;
  map.closePopup();
  const cutoff = Date.now() - 180 * DAY;
  const ls = all.filter(l => areaKeyOf(l) === key && l.price && new Date(l.last_seen || l.first_seen) >= cutoff);
  const groups = {};
  for (const l of ls) {
    const g = typeGroup(l.property_type), b = g === "land" ? null : (l.bedrooms ? Math.round(l.bedrooms) : null);
    (groups[`${g}|${b ?? ""}`] ||= { g, b, prices: [], ppm: [] }).prices.push(+l.price);
    if (l.floor_m2 >= 20) groups[`${g}|${b ?? ""}`].ppm.push(l.price / l.floor_m2);
  }
  const asking = Object.values(groups).sort((x, y) => x.g.localeCompare(y.g) || (x.b ?? 99) - (y.b ?? 99)).map(x => `
    <tr><td>${x.g === "land" ? "plots" : (x.b != null ? x.b + "-bed " : "") + (TYPE_WORD[x.g] || x.g)}</td><td class="r">${x.prices.length}</td>
      <td class="r">${rand(quantile(x.prices, .5))}</td><td class="r">${x.ppm.length ? rand(quantile(x.ppm, .5)) : "–"}</td></tr>`).join("");
  const figs = areaPrices.filter(p => p.area_key === key).sort((x, y) => x.type_group.localeCompare(y.type_group) || (x.bedrooms ?? 99) - (y.bedrooms ?? 99));
  const figRows = figs.map(p => `
    <div class="rcp"><div><b>${figLabel(p)}</b>: ${p.price ? rand(p.price) : ""}${p.price && p.price_per_m2 ? " · " : ""}${p.price_per_m2 ? rand(p.price_per_m2) + "/m²" : ""}
      <div class="meta">${[p.source, p.as_of && monthText(p.as_of), p.added_by && "added by " + p.added_by.split("@")[0]].filter(Boolean).map(esc).join(" · ")}${p.note ? "<br>" + esc(p.note) : ""}</div></div>
      ${admin || p.added_by === user?.email ? `<button class="watchbtn" data-delfig="${esc(p.id)}">Remove</button>` : ""}</div>`).join("");
  const q = encodeURIComponent(`Property24 ${a.name} ${a.city || ""} property trends sold prices`);
  const now = new Date();
  openModal(`
    <button class="closebtn" onclick="dfClose()" aria-label="Close">×</button>
    <h2>${esc(areaName(a))}</h2>
    <p class="meta">${esc(a.city || "")} · ${a.boundary_source === "official" ? "official boundary: " + esc(a.official_name || "") : a.boundary_source === "osm" ? "outline from OpenStreetMap" : a.boundary_source === "drawn" ? "outline drawn by you" : a.lat != null ? "rough outline only (dotted)" + (admin ? ": adjust it to match the real suburb" : "") : "no outline yet"}</p>
    <div class="popup-actions">
      ${admin ? `<button class="watchbtn" onclick="dfDrawArea('${esc(key)}', '${esc(listingId || "")}')">${a.boundary || a.lat != null ? "Adjust outline" : "Draw outline"}</button>
        ${areas[key] ? `<button class="watchbtn" onclick="dfRenameArea('${esc(key)}')">Rename</button>
          <button class="watchbtn" onclick="dfMergeArea('${esc(key)}')">Merge into…</button>` : ""}` : ""}
      <a class="watchbtn" style="text-decoration:none" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Find sold prices ↗</a>
      ${!areas[key] || !admin ? "" : a.hidden ? `<button class="watchbtn" onclick="dfRestoreArea('${esc(key)}')">Restore area</button>`
        : `<button class="watchbtn danger" onclick="dfDeleteArea('${esc(key)}')">Delete area</button>`}
    </div>
    ${a.display_name && a.display_name !== a.name ? `<p class="meta">Listings call it “${esc(a.name)}”.</p>` : ""}
    ${a.merged_into ? `<p class="msg err">Merged into ${esc(areaName(areas[a.merged_into]))}: its listings count as ${esc(areaName(areas[a.merged_into]))}.</p>` : ""}
    ${!admin ? `<p class="meta">Only Chris can change outlines and names.</p>` : ""}
    ${a.hidden ? `<p class="msg err">This area is deleted: it isn't shown on the map and its sold figures don't count.</p>` : ""}

    <h3>What homes sell for here</h3>
    <p class="meta">Copy these from Property24's area trends (“Find sold prices”), a Lightstone report or an agent. Listings in ${esc(areaName(a))} are then compared with them.</p>
    ${figRows || `<p class="meta"><i>None saved yet.</i></p>`}
    <form class="figform" id="figForm" style="margin-top:10px">
      <div><label class="field">Type</label><select id="f_type">
        <option value="house">house</option><option value="townhouse">townhouse</option><option value="apartment">apartment</option>
        <option value="land">plot / land</option><option value="farm">farm / smallholding</option></select></div>
      <div><label class="field">Bedrooms</label><select id="f_beds"><option value="">all sizes</option>${[1,2,3,4,5,6].map(b => `<option value="${b}" ${b === 3 ? "selected" : ""}>${b}</option>`).join("")}</select></div>
      <div><label class="field">Sold price (R)</label><input type="number" id="f_price" step="10000" min="10000" placeholder="e.g. 2400000"></div>
      <div><label class="field">or per m² (R)</label><input type="number" id="f_ppm" step="100" min="100" placeholder="optional"></div>
      <div><label class="field">Where it's from</label><input type="text" id="f_source" list="figSources" placeholder="Property24 trends"></div>
      <div><label class="field">As of</label><input type="month" id="f_asof" value="${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}"></div>
      <div class="full"><label class="field">Note (optional)</label><input type="text" id="f_note" placeholder="e.g. average of 6 sales, mostly unrenovated"></div>
      <datalist id="figSources"><option value="Property24 area trends"><option value="Private Property area info"><option value="Lightstone report"><option value="Agent (CMA)"><option value="Municipal valuation"></datalist>
      <div class="full"><button class="primary" type="submit">Save figure</button><p class="msg" id="figMsg"></p></div>
    </form>

    <h3>Asking prices now (last 6 months)</h3>
    ${asking ? `<table class="tbl"><tr><th>Kind</th><th class="r">Listings</th><th class="r">Median asking</th><th class="r">Per m²</th></tr>${asking}</table>`
             : `<p class="meta">No listings with a price here yet.</p>`}
    <p class="meta" style="margin-top:8px">Asking prices usually sit above what homes sell for, so a sold figure is the better yardstick.</p>`);
  $("f_type").addEventListener("change", () => { if ($("f_type").value === "land") $("f_beds").value = ""; });
  $("figForm").addEventListener("submit", async e => {
    e.preventDefault();
    const price = Number($("f_price").value) || null, ppm = Number($("f_ppm").value) || null;
    if (!price && !ppm) { $("figMsg").className = "msg err"; $("figMsg").textContent = "Enter a sold price or a price per m²."; return; }
    if (!(await ensureArea(a))) return;
    const row = { area_key: key, type_group: $("f_type").value, bedrooms: $("f_beds").value ? Number($("f_beds").value) : null,
      price, price_per_m2: ppm, source: $("f_source").value.trim() || null, as_of: $("f_asof").value ? $("f_asof").value + "-01" : null,
      note: $("f_note").value.trim() || null, added_by: user?.email || null };
    const { data, error } = await sb.from("area_prices").insert(row).select();
    if (error) { $("figMsg").className = "msg err"; $("figMsg").textContent = error.message; return; }
    areaPrices.push(...(data && data.length ? data : [{ ...row, id: "new" + Date.now(), created_at: new Date().toISOString() }]));
    render(); drawAreas(); dfArea(key, listingId);
  });
  $("modalBody").querySelectorAll("[data-delfig]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Remove this figure?")) return;
    const { error } = await sb.from("area_prices").delete().eq("id", b.dataset.delfig);
    if (error) { alert("Couldn't remove: " + error.message); return; }
    areaPrices = areaPrices.filter(p => p.id !== b.dataset.delfig);
    render(); drawAreas(); dfArea(key, listingId);
  }));
};

// ----- Drawing / adjusting an outline (Leaflet-Geoman) ---------------------------------------------
var drawing = null;  // { key, area, layer } (var: drawTodo may run before this line)
function drawBar(html) { const bar = $("drawbar"); bar.innerHTML = html; bar.hidden = !html; }
function stopDrawing() {
  if (map.pm) { map.pm.disableDraw(); }
  if (drawing?.layer) map.removeLayer(drawing.layer);
  map.off("pm:create");
  drawing = null; drawBar(""); drawAreas();
}
function startEditing(layer) {
  layer.eachLayer ? layer.eachLayer(x => x.pm && x.pm.enable({ allowSelfIntersection: false })) : layer.pm.enable({ allowSelfIntersection: false });
  drawBar(`<b>${esc(areaName(drawing.area))}</b>: drag the white points to move the edge${isPhone() ? "" : " (drag a faint middle point to add a corner, right-click a point to remove it)"}.
    <div class="btns"><button class="primary small" onclick="dfSaveOutline()">Save outline</button>
    <button class="watchbtn" onclick="dfRedraw()">Start again</button><button class="watchbtn" onclick="dfStopDrawing()">Cancel</button></div>`);
}
function startNewShape() {
  if (drawing.layer) { map.removeLayer(drawing.layer); drawing.layer = null; }
  drawBar(`<b>${esc(areaName(drawing.area))}</b>: ${drawing.area.lat == null ? "find the suburb (switch to Satellite top-right if it helps), then " : ""}${isPhone() ? "tap" : "click"} around its edge, and ${isPhone() ? "tap" : "click"} the first point again to finish.
    <div class="btns"><button class="watchbtn" onclick="dfStopDrawing()">Cancel</button></div>`);
  map.off("pm:create");
  map.once("pm:create", e => { drawing.layer = e.layer; startEditing(e.layer); });
  map.pm.enableDraw("Polygon", { snappable: false, allowSelfIntersection: false, templineStyle: { color: "#7048e8" }, pathOptions: { color: "#7048e8", fillOpacity: .1 } });
}
window.dfStopDrawing = stopDrawing;
window.dfRedraw = () => drawing && startNewShape();
window.dfDrawArea = (key, listingId) => {
  if (!map.pm) { alert("The drawing tool didn't load. Check your connection and reload the page."); return; }
  const a = areas[key] || areaFromListing(key, listingId);
  if (!a) return;
  closeModal(); map.closePopup();
  if (isPhone()) setView("map");
  if (drawing) stopDrawing();
  areasOn = true; try { localStorage.setItem("areas", "on"); } catch (e) {}
  drawAreas();
  drawing = { key, area: a, layer: null };
  drawTodo();
  const start = a.boundary || approxOutline(a);
  if (start) {
    drawing.layer = L.geoJSON(start, { style: { color: "#7048e8", weight: 3, fillOpacity: .12 } }).addTo(map);
    map.fitBounds(drawing.layer.getBounds(), { padding: [30, 30] });
    startEditing(drawing.layer);
  } else {
    const near = all.find(l => areaKeyOf(l) === key && l.lat != null)
      || all.find(l => normName(l.city) === normName(a.city) && l.lat != null && l.pin_level === "town");
    if (a.lat != null) map.setView([a.lat, a.lng], 15);
    else if (near) map.setView([near.lat, near.lng], 14);
    else if (REGIONS[a.region]) map.setView(REGIONS[a.region].center, 13);
    startNewShape();
  }
};
window.dfSaveOutline = async () => {
  if (!drawing?.layer) return;
  const polys = [];
  const add = g => { if (g.type === "Polygon") polys.push(g.coordinates); else if (g.type === "MultiPolygon") polys.push(...g.coordinates); };
  const gj = drawing.layer.toGeoJSON();
  (gj.type === "FeatureCollection" ? gj.features : [gj]).forEach(f => add(f.geometry || f));
  if (!polys.length) return;
  const boundary = polys.length === 1 ? { type: "Polygon", coordinates: polys[0] } : { type: "MultiPolygon", coordinates: polys };
  const a = drawing.area, key = drawing.key;
  const row = { key, name: a.name, city: a.city, region: a.region, lat: a.lat, lng: a.lng, boundary, boundary_source: "drawn",
                boundary_checked_at: new Date().toISOString(), updated_by: user?.email || null, updated_at: new Date().toISOString() };
  const { error } = await sb.from("areas").upsert(row);
  if (error) { alert("Couldn't save the outline: " + error.message); return; }
  areas[key] = { ...(areas[key] || {}), ...row };
  stopDrawing();
  applyAreaPins(); render();
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && drawing) stopDrawing(); });
drawAreas();
</script>
</body>
</html>
